<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4f1ea" />
<title>Rag Client — local-first RAG</title>
<link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
<header class="top">
  <div class="brand">Rag Client <span class="stage">v0 · full surface</span></div>
  <div class="tier" id="tier">detecting compute…</div>
  <button id="signOut" class="ghostbtn hidden">Sign out</button>
</header>
<main>
  <section id="loginPane" class="card">
    <h2>Sign in</h2>
    <input id="uid" type="text" placeholder="ID" autocomplete="username" />
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="loginBtn">Sign in</button>
    <p class="hint">API-fallback path. Local tiers unlock as stages land.</p>
  </section>
  <div id="app" class="hidden">
    <div id="tabs">
      <button data-tab="chat" class="on">Chat</button>
      <button data-tab="lib">Library</button>
    </div>
    <label class="guardrow"><input id="layaToggle" type="checkbox" /> 🛡 Laya guard</label>
    <section id="pane-chat">
      <div id="thread"></div>
    </section>
    <section id="pane-lib" class="hidden">
      <div class="card">
        <div class="row"><input id="file" type="file" accept=".txt,.md,.pdf,.docx,.pptx" /><button id="upBtn">Upload</button></div>
        <p class="hint" id="upMsg">Max 25 MB from mobile. Books stay on your laptop.</p>
      </div>
      <h2>Library <span id="docCount" class="hint"></span></h2>
      <div id="docList"></div>
    </section>
  </div>
</main>
<footer class="composer hidden" id="composer">
  <textarea id="q" rows="1" placeholder="Ask grounded…"></textarea>
  <button id="ask">↑</button>
</footer>
<div id="viewer" class="overlay hidden">
  <div class="sheet wide">
    <div class="vhead">
      <strong id="viewerTitle">Source</strong>
      <span id="viewerPage"></span>
      <button id="viewerClose">✕</button>
    </div>
    <div class="vtools">
      <button id="viewerTocBtn">Contents</button>
      <input id="viewerSearch" type="text" placeholder="Search in book…" />
      <button id="viewerSearchGo">🔍</button>
    </div>
    <div id="viewerToc" class="hidden"></div>
    <div id="viewerResults"></div>
    <p id="viewerStatus" class="hint"></p>
    <iframe id="viewerFrame" title="source" sandbox="allow-same-origin"></iframe>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
